name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S TrayApp -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Assemble release package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          $required = @("package/TrayApp.exe", "package/TrayService.exe")
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required artifact was not produced: $path"
            }
          }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayApp-windows-x64
          path: package
